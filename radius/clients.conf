# ─────────────────────────────────────────────────────────────
# Clientes RADIUS (lista global)
#
# Os equipamentos de rede (NAS) reais vêm da tabela `nas` do MySQL:
#   - no boot: carregados por `read_clients = yes` (módulo sql) nesta lista
#   - em runtime (novo cadastro sem reload): origem desconhecida casa o
#     template `client dynamic` abaixo e é resolvida pelo virtual server
#     `dynamic_clients`, que consulta a tabela `nas`.
#
# A correspondência é sempre pela rota mais específica, então os /32
# (localhost e clientes SQL) têm precedência sobre o 0.0.0.0/0.
# ─────────────────────────────────────────────────────────────

client localhost {
    ipaddr = 127.0.0.1
    proto  = *
    secret = "$ENV{RADIUS_TEST_SECRET}"
    require_message_authenticator = no
    nas_type  = other
    shortname = localhost
}

client localhost_ipv6 {
    ipv6addr = ::1
    secret   = "$ENV{RADIUS_TEST_SECRET}"
}

client dynamic {
    ipaddr = 0.0.0.0/0
    netmask = 0
    dynamic_clients = dynamic_clients
    lifetime = 600
    secret = "unused-placeholder-overridden-per-client"
    # Mitigação BlastRADIUS (CVE-2024-3596). Controlado por RADIUS_REQUIRE_MA
    # (padrão "auto": exige de quem já envia; "yes": exige de todos).
    require_message_authenticator = $ENV{RADIUS_REQUIRE_MA}
}
