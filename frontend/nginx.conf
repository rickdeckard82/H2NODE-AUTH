# Entrypoint único da aplicação: serve a SPA e encaminha /api para o backend.
# Fica atrás de um reverse proxy externo (Nginx Proxy Manager, Caddy, LB) que
# faz TLS + domínio. Também é usado atrás do proxy TLS embutido (profile tls-proxy).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;
    server_tokens off;

    # IP real do cliente: só aceita X-Forwarded-For vindo dos proxies confiáveis
    # (FORWARDED_ALLOW_IPS, gerado em /etc/nginx/realip.conf no start). Para o
    # backend vai só $remote_addr — o cliente não consegue forjar o IP do
    # rate-limit, do bloqueio de login nem da auditoria.
    include /etc/nginx/realip.conf;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Métricas Prometheus: nunca pela borda. Um scraper na rede interna acessa
    # backend:8000/api/metrics diretamente.
    location = /api/metrics {
        return 404;
    }

    # API -> backend FastAPI
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        # repassa o esquema visto pelo proxy externo (https no NPM); http se ausente
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Restauração de backup: o dump chega a 200 MB (teto do backend) e o
    # DROP/CREATE + INSERT de toda a base pode levar minutos.
    location = /api/backup/import {
        client_max_body_size 200m;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 600s;
    }

    # Não sirva arquivos ocultos nem markdown que possam ir para public/
    location ~ /\.        { return 404; }
    location ~* \.md$     { return 404; }

    # Assets com hash no nome: cache agressivo (o add_header próprio faz o nginx
    # NÃO herdar os add_header do server — inclusive o Cache-Control abaixo).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (React Router). O index.html NÃO tem hash no nome; sem isto o
    # navegador (ou o proxy externo) pode servir uma versão antiga apontando para
    # bundles que já não existem. "no-cache" = pode guardar, mas revalida sempre.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Cabeçalhos de segurança para o HTML/JS servido daqui.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
}
