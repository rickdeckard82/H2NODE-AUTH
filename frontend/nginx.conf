# Entrypoint único da aplicação: serve a SPA e encaminha /api para o backend.
# Fica atrás de um reverse proxy externo (Nginx Proxy Manager, Caddy, LB) que
# faz TLS + domínio. Também é usado atrás do proxy TLS embutido (profile tls-proxy).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;
    server_tokens off;

    # Métricas Prometheus: nunca pela borda. Um scraper na rede interna acessa
    # backend:8000/api/metrics diretamente.
    location = /api/metrics {
        return 404;
    }

    # API -> backend FastAPI
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # repassa o esquema visto pelo proxy externo (https no NPM); http se ausente
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Não sirva arquivos ocultos nem markdown que possam ir para public/
    location ~ /\.        { return 404; }
    location ~* \.md$     { return 404; }

    # Assets com hash no nome: cache agressivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeçalhos de segurança para o HTML/JS servido daqui.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
}
