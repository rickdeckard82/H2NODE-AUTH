<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="H2NODE Auth">
  <style>
    .flow { stroke-dasharray: 16 84; animation: flow 2.4s linear infinite; }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 2.4s ease-out infinite; }
    .node { transform-box: fill-box; transform-origin: center; animation: beat 2.4s ease-in-out infinite; }
    @keyframes flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes halo { 0% { transform: scale(1); opacity: .7; } 70%, 100% { transform: scale(2.1); opacity: 0; } }
    @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } }
    @media (prefers-reduced-motion: reduce) { .flow, .halo { display: none; } .node { animation: none; } }
  </style>
  <rect width="48" height="48" rx="12" fill="#0b1022"/>
  <!-- escudo: o AAA guardando o acesso aos equipamentos -->
  <path d="M24 6.5l13 4.6v10.4c0 9.2-5.6 16.3-13 18.9-7.4-2.6-13-9.7-13-18.9V11.1z" fill="none" stroke="#a5b4fc" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- pulso de autenticação percorrendo o escudo -->
  <path class="flow" d="M24 6.5l13 4.6v10.4c0 9.2-5.6 16.3-13 18.9-7.4-2.6-13-9.7-13-18.9V11.1z" pathLength="100" fill="none" stroke="#22d3ee" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- nós H2NODE -->
  <g stroke="#a5b4fc" stroke-width="2.2" stroke-linecap="round">
    <line x1="18.5" y1="16" x2="18.5" y2="30"/>
    <line x1="18.5" y1="30" x2="30" y2="23"/>
    <line x1="30" y1="23" x2="18.5" y2="16"/>
  </g>
  <circle class="halo" cx="30" cy="23" r="3.6" fill="none" stroke="#22d3ee" stroke-width="1.3"/>
  <circle cx="18.5" cy="16" r="3.6" fill="#a78bfa"/>
  <circle cx="18.5" cy="30" r="3.6" fill="#a78bfa"/>
  <circle class="node" cx="30" cy="23" r="3.6" fill="#22d3ee"/>
</svg>
