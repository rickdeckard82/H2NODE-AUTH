# Overrides para desenvolvimento / teste local (HTTP, sem reverse proxy):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# - COOKIE_SECURE=false  -> cookies funcionam sobre http://localhost
# - backend com autoreload + migração/seed no start; API também direto em :8000
# - MySQL exposto em :3306; FreeRADIUS em modo debug
# Abra:  http://localhost:8080   (container frontend: SPA + /api)
#   ou:  http://localhost:5173   (se rodar o Vite à parte: cd frontend && npm run dev)
services:
  db:
    ports:
      - "3306:3306"

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"   # pytest/httpx/ruff disponíveis no container (make test-backend)
    command:
      - sh
      - -c
      - "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      COOKIE_SECURE: "false"
      LOG_LEVEL: DEBUG
      ENABLE_DOCS: "true"
      # aceita a origem do container frontend (:8080) e a do Vite (:5173)
      FRONTEND_ORIGIN: http://localhost:8080
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
    ports:
      - "8000:8000"

  freeradius:
    # -X = modo debug em foreground (muito verboso, ótimo para troubleshooting)
    command: ["freeradius", "-fxx", "-l", "stdout"]
