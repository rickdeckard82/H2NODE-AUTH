# Overlay opcional: lê JWT_SECRET e FERNET_KEY de arquivos (Docker secrets) em
# vez de variáveis de ambiente — assim não aparecem em `docker inspect`.
#
#   make secrets                       # gera ./secrets/{jwt_secret,fernet_key}
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# Requer que ./secrets/jwt_secret e ./secrets/fernet_key existam.
secrets:
  jwt_secret:
    file: ./secrets/jwt_secret
  fernet_key:
    file: ./secrets/fernet_key

services:
  backend:
    secrets:
      - jwt_secret
      - fernet_key
    environment:
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      FERNET_KEY_FILE: /run/secrets/fernet_key
