#!/opt/tacplus/sbin/tac_plus-ng
# ─────────────────────────────────────────────────────────────
# Config estática do Pulse. Usuários/senha/grupo vêm do MySQL via MAVIS
# (pulse_mavis.py). Equipamentos (host) e perfis (group/profile/ruleset) são
# gerados pelo painel em /etc/tacacs-shared/pulse.cfg e recarregados com
# SIGHUP quando mudam.
#
# Debug ao vivo:  tac_plus-ng -d 2047 -D -f <este arquivo>
# ─────────────────────────────────────────────────────────────

id = spawnd {
    background = no
    listen { port = 49 }
    spawn {
        instances min = 1
        instances max = 8
    }
}

id = tac_plus-ng {
    log access { destination = /var/log/tac_plus-ng/access.log }
    access log = access
    authorization log = access

    log acct {
        destination = /var/log/tac_plus-ng/acct.log
        prefix = ""
        postfix = "\n"
        accounting format = "%Y-%m-%dT%H:%M:%S${FS}${accttype}${FS}${nas}${FS}${user}${FS}${nac}${FS}${device.port}${FS}${service}${FS}${cmd, }"
    }
    accounting log = acct

    # Backend MySQL do painel (autenticação + grupo do usuário).
    # O pulse_mavis.py lê SQL_* do ambiente (herdado do container).
    # Forma do exec: <programa> "<argv0>" "<argv1>" ...
    mavis module = external {
        exec = /usr/bin/python3 "python3" "/opt/pulse/pulse_mavis.py"
        childs min = 2
        childs max = 16
    }

    login backend = mavis
    pap backend = mavis
    user backend = mavis

    # Equipamentos + grupos + perfis + ruleset (gerado pelo painel; stub vazio no 1º boot).
    include = /etc/tacacs-shared/pulse.cfg
}
