name: h2node-auth

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

# Nomes fixos dos volumes. Instalações de antes do rebranding (projeto "pulse-radius")
# usam VOLUME_PREFIX=pulse-radius no .env para continuar com o banco, os backups e a
# config do TACACS+ de sempre (scripts/migrar-h2node.sh faz isso).
volumes:
  db_data:
    name: ${VOLUME_PREFIX:-h2node-auth}_db_data
  radius_logs:
    name: ${VOLUME_PREFIX:-h2node-auth}_radius_logs
  db_backups:
    name: ${VOLUME_PREFIX:-h2node-auth}_db_backups
  tacacs_conf:
    name: ${VOLUME_PREFIX:-h2node-auth}_tacacs_conf
  tacacs_logs:
    name: ${VOLUME_PREFIX:-h2node-auth}_tacacs_logs

services:
  # ─────────────────────────── MySQL ───────────────────────────
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-radius}
      MYSQL_BACKEND_USER: ${MYSQL_BACKEND_USER:-backend_svc}
      MYSQL_BACKEND_PASSWORD: ${MYSQL_BACKEND_PASSWORD:?set MYSQL_BACKEND_PASSWORD}
      MYSQL_RADIUS_USER: ${MYSQL_RADIUS_USER:-radius_svc}
      MYSQL_RADIUS_PASSWORD: ${MYSQL_RADIUS_PASSWORD:?set MYSQL_RADIUS_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # Scripts em db/init rodam UMA vez, na criação do volume, em ordem alfabética.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Publicado SÓ em loopback: freeradius e tacacs (network_mode: host) acessam o
    # MySQL por 127.0.0.1. Porta publicada exige uma rede não-internal (edge).
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-3306}:3306"
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  # ───────────────────────── FreeRADIUS ────────────────────────
  freeradius:
    build:
      context: ./radius
    restart: unless-stopped
    environment:
      SQL_HOST: 127.0.0.1
      SQL_PORT: "${DB_LOCAL_PORT:-3306}"
      SQL_DB: ${MYSQL_DATABASE:-radius}
      SQL_USER: ${MYSQL_RADIUS_USER:-radius_svc}
      SQL_PASSWORD: ${MYSQL_RADIUS_PASSWORD:?set MYSQL_RADIUS_PASSWORD}
      RADIUS_TEST_SECRET: ${RADIUS_TEST_SECRET:-testing123}
      # auto = exige Message-Authenticator dos NAS que já o enviam (BlastRADIUS).
      # yes = exige de todos; troque só se todo o parque suportar.
      RADIUS_REQUIRE_MA: ${RADIUS_REQUIRE_MA:-auto}
    # Usa a pilha de rede do host: escuta direto em 1812/1813 udp, sem NAT do Docker.
    # O filtro por origem é o `ufw allow` comum (INPUT), sem precisar de ufw-docker.
    network_mode: host
    volumes:
      - radius_logs:/var/log/radius
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "printf 'Message-Authenticator = 0x00\\n' | radclient -r 1 -t 3 127.0.0.1:1812 status \"$$RADIUS_TEST_SECRET\" >/dev/null 2>&1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

  # ───────────────────────────── TACACS+ ──────────────────────────────
  # tac_plus-ng com backend MySQL (MAVIS). Cobre Huawei / Juniper / Datacom / A10 / ZTE / Dell
  # que falam TACACS+ (o MikroTik não tem cliente TACACS+ e fica em RADIUS).
  tacacs:
    build:
      context: .
      dockerfile: tacacs/Dockerfile
    restart: unless-stopped
    environment:
      SQL_HOST: 127.0.0.1
      SQL_PORT: "${DB_LOCAL_PORT:-3306}"
      SQL_DB: ${MYSQL_DATABASE:-radius}
      SQL_USER: ${MYSQL_RADIUS_USER:-radius_svc}
      SQL_PASSWORD: ${MYSQL_RADIUS_PASSWORD:?set MYSQL_RADIUS_PASSWORD}
      # Opcional: IP deste servidor TACACS+, exibido como "IP de destino" das
      # tentativas de login na tela Authentication (o access.log não o traz).
      TACACS_SERVER_IP: ${TACACS_SERVER_IP:-}
      TACACS_UNKNOWN_IP: ${TACACS_UNKNOWN_IP:-allow}
    # Usa a pilha de rede do host: escuta direto em 49/tcp, sem NAT do Docker.
    network_mode: host
    volumes:
      - tacacs_conf:/etc/tacacs-shared
      - tacacs_logs:/var/log/tac_plus-ng
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof tac_plus-ng >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ──────────────── Redis (storage do rate-limit) ─────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      redis-server --save "" --appendonly no
      --maxmemory 64mb --maxmemory-policy allkeys-lru
      --requirepass "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────────── Backend ─────────────────────────
  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_BACKEND_USER:-backend_svc}:${MYSQL_BACKEND_PASSWORD}@db:3306/${MYSQL_DATABASE:-radius}
      # Via .env (padrão) ou via arquivo com o overlay docker-compose.secrets.yml
      # (JWT_SECRET_FILE / FERNET_KEY_FILE). A app valida a presença no boot.
      JWT_SECRET: ${JWT_SECRET:-}
      FERNET_KEY: ${FERNET_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RADIUS_DB_USER: ${MYSQL_RADIUS_USER:-radius_svc}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
      # Arquivo de config do tac_plus-ng gerado pelo painel (volume compartilhado).
      TACACS_HOSTS_PATH: /etc/tacacs-shared/h2node.cfg
    networks:
      - edge
      - internal
    volumes:
      - tacacs_conf:/etc/tacacs-shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # garante que o tacacs já ajustou as permissões do volume compartilhado
      tacacs:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────── Backup automático agendado por FTP/FTPS ───────────
  # Mesma imagem do backend. Horário, destino FTP e retenção são configurados no
  # painel (Backup e restauração); este worker só consulta a agenda a cada
  # BACKUP_WORKER_INTERVAL_SECONDS e envia o dump (.sql.enc cifrado com a
  # FERNET_KEY, ou .sql.gz). Nenhuma cópia fica no servidor.
  # Também roda o expurgo diário de retenção LGPD (prazos em Configurações > LGPD).
  backup-worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    restart: unless-stopped
    command: ["python", "-m", "app.backup_worker"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_BACKEND_USER:-backend_svc}:${MYSQL_BACKEND_PASSWORD}@db:3306/${MYSQL_DATABASE:-radius}
      JWT_SECRET: ${JWT_SECRET:-}
      FERNET_KEY: ${FERNET_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKUP_WORKER_INTERVAL_SECONDS: ${BACKUP_WORKER_INTERVAL_SECONDS:-30}
    networks:
      # edge: saída para o servidor FTP. internal: acesso ao MySQL.
      - edge
      - internal
    depends_on:
      db:
        condition: service_healthy
      # o backend aplica as migrações (tabela app_backup_schedule) no boot
      backend:
        condition: service_healthy

  # ─────────────────────────── Frontend ────────────────────────
  # Serve a SPA e encaminha /api -> backend. É o entrypoint HTTP da aplicação:
  # coloque seu reverse proxy (Nginx Proxy Manager, Caddy, LB da nuvem) na frente
  # apontando para  http://<IP-privado-do-servidor>:${WEB_PORT:-8080}
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # Reverse proxies confiáveis (IP/CIDR, separados por vírgula): só deles o
      # X-Forwarded-For vale como IP do cliente. "*" = faixas privadas (LAN).
      # Em produção, o IP do Nginx Proxy Manager.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    ports:
      # WEB_BIND pode ser o IP privado do servidor para não expor em todas as interfaces.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    networks:
      - edge
    depends_on:
      - backend

  # ───────────── Proxy TLS embutido (somente com: --profile tls-proxy) ─────────────
  # Use apenas se NÃO houver um reverse proxy externo. Faz TLS (self-signed em dev
  # ou cert montado) e também roteia /api. Ignore-o quando usar Nginx Proxy Manager.
  proxy:
    build:
      context: ./proxy
    restart: unless-stopped
    profiles: ["tls-proxy"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Monte aqui server.crt / server.key reais em produção.
      # Em dev, o container gera um self-signed se o diretório estiver vazio.
      - ./proxy/tls:/etc/nginx/tls
    networks:
      - edge
    depends_on:
      - frontend
      - backend

  # ─────────── Backup automático do MySQL (ativo por padrão) ────────────
  # mysqldump periódico, cifrado com BACKUP_ENCRYPTION_KEY (AES-256 via openssl)
  # sempre que essa variável estiver definida — o dump contém hashes de senha e
  # os shared secrets RADIUS em claro, então cifrar é o padrão recomendado.
  # Restaurar um .sql.enc manualmente:
  #   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in x.sql.enc -out x.sql -pass env:BACKUP_ENCRYPTION_KEY
  # Para desligar (ex.: dev), suba com: docker compose up -d --scale db-backup=0
  db-backup:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$BACKUP_ENCRYPTION_KEY" ]; then
          echo "[db-backup] AVISO: BACKUP_ENCRYPTION_KEY vazio — dumps ficarão em texto claro (senhas + segredos RADIUS). Defina BACKUP_ENCRYPTION_KEY no .env (openssl rand -base64 32).";
        fi
        echo "[db-backup] intervalo=$${BACKUP_INTERVAL_SECONDS}s manter=$${BACKUP_KEEP}";
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S);
          if [ -n "$$BACKUP_ENCRYPTION_KEY" ]; then
            out="/backups/radius-$${ts}.sql.enc";
            if mysqldump -h db -u root --single-transaction --routines --events radius \
                 | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
                     -pass env:BACKUP_ENCRYPTION_KEY -out "$$out"; then
              echo "[db-backup] $${out} ok (cifrado)";
            else
              echo "[db-backup] FALHA"; rm -f "$$out";
            fi
          else
            out="/backups/radius-$${ts}.sql";
            if mysqldump -h db -u root --single-transaction --routines --events radius > "$$out"; then
              echo "[db-backup] $${out} ok (SEM cifra)";
            else
              echo "[db-backup] FALHA"; rm -f "$$out";
            fi
          fi
          ls -1t /backups/*.sql /backups/*.sql.enc 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f;
          sleep "$${BACKUP_INTERVAL_SECONDS}";
        done
    volumes:
      - db_backups:/backups
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  # ─────────── Adminer (somente com: --profile dev) ────────────
  adminer:
    image: adminer:4
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    networks:
      - internal
      - edge
    depends_on:
      - db
